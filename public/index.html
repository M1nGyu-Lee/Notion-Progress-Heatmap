<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Notion Task Heatmap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cal-heatmap/cal-heatmap.css" />
    <style>
        body {
            padding-top: 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #191919; /* 노션 다크모드 검정 배경 */
            color: #787878;
        }
        /* 캘린더 월/일 라벨 텍스트 색상 */
        .cal-heatmap-container .graph-label, 
        .cal-heatmap-container text {
            fill: #787878 !important;
            color: #787878 !important;
            font-size: 11px;
        }
        /* ⭐ [핵심] 라이브러리의 하얀색 빈 격자를 다크모드 회색(#202020)으로 강제 덮어쓰기 */
        .cal-heatmap-container rect.q0,
        .cal-heatmap-container .graph-rect:not([fill]),
        .cal-heatmap-container rect[fill="#ebedf0"],
        .cal-heatmap-container rect[fill="#ededed"] {
            fill: #202020 !important;
            stroke: #191919 !important; /* 노션 검정 배경과 부드러운 경계선 처리 */
        }
    </style>
</head>
<body>
    <div id="cal-heatmap"></div>
    <script src="https://cdn.jsdelivr.net/npm/d3@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/cal-heatmap/cal-heatmap.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const baseUrl = window.location.origin;
            const cal = new CalHeatMap();
            cal.init({
                itemSelector: "#cal-heatmap",
                domain: "month",
                subDomain: "day",
                data: baseUrl + "/api/database",
                start: new Date(new Date().getFullYear(), new Date().getMonth() - 5),
                cellSize: 11,
                cellPadding: 3,
                range: 6,
                tooltip: true,
                considerMissingDataAsZero: true, // 빈 날짜도 데이터값 0으로 처리
                legend: [1],
                legendColors: {
                    min: "#202020",
                    base: "#202020",
                    colors: ["#84c688"], // 일지 쓴 날 단일 연녹색
                    empty: "#202020"
                },
                subDomainTitleFormat: {
                    empty: "{date}",
                    filled: "{date} (수업 일지 작성완료)"
                },
                afterLoadData: function(data) {
                    if (!data) return {};
                    var result = {};
                    data.forEach(function(item) {
                        var date = new Date(item.date).getTime() / 1000;
                        result[date] = item.progress;
                    });
                    return result;
                }
            });
            setInterval(function() {
                cal.update(baseUrl + "/api/database");
            }, 30000);
        });
    </script>
</body>
</html>
