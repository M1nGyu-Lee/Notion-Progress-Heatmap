<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Notion Task Heatmap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cal-heatmap/cal-heatmap.css" />
    <style>
        body {
            padding-top: 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #191919; /* 노션 다크모드 검정 배경 */
            color: #a0a0a0;
        }
        /* 캘린더 월/일 라벨 텍스트 */
        .cal-heatmap-container .graph-label, 
        .cal-heatmap-container text {
            fill: #a0a0a0 !important;
            color: #a0a0a0 !important;
            font-size: 11px;
        }
        /* ⭐ 1. [과거/현재/미래 포함] 모든 칸의 기본값을 무조건 밝은 회색(#383838)으로 지정 */
        .cal-heatmap-container rect,
        .cal-heatmap-container .graph-rect {
            fill: #383838 !important;
            stroke: #191919 !important; /* 노션 검정 배경과 깨끗한 경계선 */
        }
        /* ⭐ 2. [진짜 일지 쓴 날만] 연녹색(#84c688)으로 선명하게 표시 */
        .cal-heatmap-container rect.q1,
        .cal-heatmap-container rect.q2,
        .cal-heatmap-container rect.q3,
        .cal-heatmap-container rect.q4,
        .cal-heatmap-container rect.q5 {
            fill: #84c688 !important;
        }
    </style>
</head>
<body>
    <div id="cal-heatmap"></div>
    <script src="https://cdn.jsdelivr.net/npm/d3@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/cal-heatmap/cal-heatmap.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const baseUrl = window.location.origin;
            const cal = new CalHeatMap();
            cal.init({
                itemSelector: "#cal-heatmap",
                domain: "month",
                subDomain: "day",
                data: baseUrl + "/api/database",
                start: new Date(new Date().getFullYear(), new Date().getMonth() - 5),
                cellSize: 11,
                cellPadding: 3,
                range: 6,
                tooltip: true,
                considerMissingDataAsZero: false, // ⭐ 빈 날짜에 0을 부여해 엉뚱하게 칠해지는 문제 방지
                legend: [1],
                legendColors: {
                    min: "#383838",
                    base: "#383838",
                    colors: ["#84c688"],
                    empty: "#383838"
                },
                subDomainTitleFormat: {
                    empty: "{date}",
                    filled: "{date} (수업 일지 작성완료)"
                },
                afterLoadData: function(data) {
                    if (!data) return {};
                    var result = {};
                    data.forEach(function(item) {
                        var date = new Date(item.date).getTime() / 1000;
                        result[date] = item.progress;
                    });
                    return result;
                }
            });
            setInterval(function() {
                cal.update(baseUrl + "/api/database");
            }, 30000);
        });
    </script>
</body>
</html>
