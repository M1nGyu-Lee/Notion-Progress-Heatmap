<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Notion Task Heatmap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cal-heatmap/cal-heatmap.css" />
    <style>
        /* 1. 바탕 전체: 노션 다크모드 검은 화면색 (#191919) */
        body {
            padding-top: 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #191919;
            color: #8b949e;
        }
        /* 큰 월(Month) 틀 배경은 노션 검은색(#191919)으로 지정 */
        .cal-heatmap-container rect.domain-background,
        .cal-heatmap-container .graph-domain-bg,
        .cal-heatmap-container .ch-domain-bg {
            fill: #191919 !important;
            stroke: none !important;
        }
        /* 캘린더 라벨 텍스트 */
        .cal-heatmap-container .graph-label, 
        .cal-heatmap-container text {
            fill: #8b949e !important;
            color: #8b949e !important;
            font-size: 11px;
        }
        /* ⭐ 2. [오직 안 쓴 빈 작은 네모칸들만] 쨍한 하얀색 차단하고 세련된 회색(#2d3137)으로 지정 */
        .cal-heatmap-container rect.graph-rect:not(.domain-background),
        .cal-heatmap-container rect.subdomain-rect,
        .cal-heatmap-container rect.q0 {
            fill: #2d3137 !important;
            stroke: #191919 !important; /* 사각형 간 1px 검은색 경계선 */
        }
        /* ⭐ 3. [작성한 날만] 연녹색(#68b072)으로 선명하게 적용 */
        .cal-heatmap-container rect[class*="q"]:not(.q0),
        .cal-heatmap-container rect.q1,
        .cal-heatmap-container rect.q2,
        .cal-heatmap-container rect.q3,
        .cal-heatmap-container rect.q4,
        .cal-heatmap-container rect.q5 {
            fill: #68b072 !important;
            stroke: #191919 !important;
        }
    </style>
</head>
<body>
    <div id="cal-heatmap"></div>
    <script src="https://cdn.jsdelivr.net/npm/d3@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/cal-heatmap/cal-heatmap.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const baseUrl = window.location.origin;
            const cal = new CalHeatMap();
            cal.init({
                itemSelector: "#cal-heatmap",
                domain: "month",
                subDomain: "day",
                data: baseUrl + "/api/database",
                start: new Date(new Date().getFullYear(), new Date().getMonth() - 5),
                cellSize: 11,
                cellPadding: 3,
                range: 6,
                tooltip: true,
                considerMissingDataAsZero: false,
                legend: [1],
                legendColors: {
                    min: "#2d3137",
                    base: "#2d3137",
                    colors: ["#68b072"],
                    empty: "#2d3137"
                },
                subDomainTitleFormat: {
                    empty: "{date}",
                    filled: "{date} (수업 일지 작성완료)"
                },
                afterLoadData: function(data) {
                    if (!data) return {};
                    var result = {};
                    data.forEach(function(item) {
                        var date = new Date(item.date).getTime() / 1000;
                        result[date] = item.progress;
                    });
                    return result;
                }
            });
            setInterval(function() {
                cal.update(baseUrl + "/api/database");
            }, 30000);
        });
    </script>
</body>
</html>
