<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Notion Task Heatmap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cal-heatmap/cal-heatmap.css" />
    <style>
        /* 1. 바탕색: 노션 다크모드 검은 화면색 (#191919) */
        body {
            padding-top: 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #191919;
            color: #8b949e;
        }
        /* 캘린더 라벨 텍스트 */
        .cal-heatmap-container .graph-label, 
        .cal-heatmap-container text {
            fill: #8b949e !important;
            color: #8b949e !important;
            font-size: 11px;
        }
        /* 2. 네모 색깔: 안 쓴 날 & 미래 날짜 포함 네모만 회색(#2d3137)으로 지정 */
        .cal-heatmap-container rect.q0,
        .cal-heatmap-container .graph-rect,
        .cal-heatmap-container rect:not([class*="q"]) {
            fill: #2d3137 !important;
            stroke: #191919 !important; /* 노션 검은 바탕과 깔끔하게 구분되는 경계선 */
        }
        /* 3. 작성한 날: 절대 덮어씌워지지 않는 자연스러운 파스텔 연녹색(#68b072) */
        .cal-heatmap-container rect[class*="q"]:not(.q0) {
            fill: #68b072 !important;
            stroke: #191919 !important;
        }
    </style>
</head>
<body>
    <div id="cal-heatmap"></div>
    <script src="https://cdn.jsdelivr.net/npm/d3@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/cal-heatmap/cal-heatmap.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const baseUrl = window.location.origin;
            const cal = new CalHeatMap();
            cal.init({
                itemSelector: "#cal-heatmap",
                domain: "month",
                subDomain: "day",
                data: baseUrl + "/api/database",
                start: new Date(new Date().getFullYear(), new Date().getMonth() - 5),
                cellSize: 11,
                cellPadding: 3,
                range: 6,
                tooltip: true,
                considerMissingDataAsZero: false,
                legend: [1],
                legendColors: {
                    min: "#2d3137",
                    base: "#2d3137",
                    colors: ["#68b072"],
                    empty: "#2d3137"
                },
                subDomainTitleFormat: {
                    empty: "{date}",
                    filled: "{date} (수업 일지 작성완료)"
                },
                afterLoadData: function(data) {
                    if (!data) return {};
                    var result = {};
                    data.forEach(function(item) {
                        var date = new Date(item.date).getTime() / 1000;
                        result[date] = item.progress;
                    });
                    return result;
                }
            });
            setInterval(function() {
                cal.update(baseUrl + "/api/database");
            }, 30000);
        });
    </script>
</body>
</html>
