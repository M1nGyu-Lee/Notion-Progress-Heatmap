<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Notion Task Heatmap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cal-heatmap/cal-heatmap.css" />
    <style>
        body {
            padding-top: 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #191919; /* 노션 다크모드 검정 배경 */
            color: #a0a0a0;
        }
        /* 캘린더 월/일 라벨 텍스트 */
        .cal-heatmap-container .graph-label, 
        .cal-heatmap-container text {
            fill: #a0a0a0 !important;
            color: #a0a0a0 !important;
            font-size: 11px;
        }
        /* ⭐ [오직 빈 칸만] 너무 어둡지 않은 세련된 밝은 회색(#383838) 지정 */
        .cal-heatmap-container rect.q0,
        .cal-heatmap-container rect[fill="#202020"],
        .cal-heatmap-container rect[fill="#252525"],
        .cal-heatmap-container rect[fill="#ebedf0"],
        .cal-heatmap-container rect[fill="#ededed"] {
            fill: #383838 !important;
            stroke: #191919 !important;
        }
        /* ⭐ [작성한 날짜 연녹색 보장] 연녹색 칸은 절대 덮어씌워지지 않도록 지킴 */
        .cal-heatmap-container rect.q1,
        .cal-heatmap-container rect[fill="#84c688"] {
            fill: #84c688 !important;
        }
    </style>
</head>
<body>
    <div id="cal-heatmap"></div>
    <script src="https://cdn.jsdelivr.net/npm/d3@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/cal-heatmap/cal-heatmap.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const baseUrl = window.location.origin;
            const cal = new CalHeatMap();
            cal.init({
                itemSelector: "#cal-heatmap",
                domain: "month",
                subDomain: "day",
                data: baseUrl + "/api/database",
                start: new Date(new Date().getFullYear(), new Date().getMonth() - 5),
                cellSize: 11,
                cellPadding: 3,
                range: 6,
                tooltip: true,
                considerMissingDataAsZero: true,
                legend: [1],
                legendColors: {
                    min: "#383838", // 빈 칸 색상
                    base: "#383838",
                    colors: ["#84c688"], // 작성한 날 연녹색
                    empty: "#383838"
                },
                subDomainTitleFormat: {
                    empty: "{date}",
                    filled: "{date} (수업 일지 작성완료)"
                },
                afterLoadData: function(data) {
                    if (!data) return {};
                    var result = {};
                    data.forEach(function(item) {
                        var date = new Date(item.date).getTime() / 1000;
                        result[date] = item.progress;
                    });
                    return result;
                }
            });
            setInterval(function() {
                cal.update(baseUrl + "/api/database");
            }, 30000);
        });
    </script>
</body>
</html>
