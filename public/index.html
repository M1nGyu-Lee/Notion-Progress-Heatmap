<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Notion Task Heatmap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cal-heatmap/cal-heatmap.css" />
    <style>
        body {
            padding-top: 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #191919; /* 노션 다크모드 검정 배경 */
            color: #9b9b9b; /* 쨍하지 않은 차분한 회색 텍스트 */
        }

        /* 캘린더 라벨(월/일) 은은한 회색으로 조절 */
        .cal-heatmap-container .graph-label, 
        .cal-heatmap-container text {
            fill: #8a8a8a !important;
            color: #8a8a8a !important;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div id="cal-heatmap"></div>
    <script src="https://cdn.jsdelivr.net/npm/d3@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/cal-heatmap/cal-heatmap.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const baseUrl = window.location.origin;

            const cal = new CalHeatMap();
            cal.init({
                itemSelector: "#cal-heatmap",
                domain: "month",
                subDomain: "day",
                data: baseUrl + "/api/database",
                start: new Date(new Date().getFullYear(), new Date().getMonth() - 5),
                cellSize: 11,
                cellPadding: 3,
                range: 6,
                tooltip: true,
                considerMissingDataAsZero: false,
                legend: [25, 50, 75, 90],
                // 부드럽고 연한 연녹색(Soft Light Green) 파스텔 색상 팔레트
                legendColors: {
                    min: "#252525",  // 빈 격자 (어두운 회색)
                    base: "#252525",
                    colors: ["#3b6e4e", "#589c67", "#84c688", "#b8edb5"], // 부드러운 연녹색 단계
                    empty: "#252525"
                },
                subDomainTitleFormat: {
                    empty: "{date}",
                    filled: "{count}% on {date}"
                },
                afterLoadData: function(data) {
                    if (!data) return {};
                    var result = {};
                    data.forEach(function(item) {
                        var date = new Date(item.date).getTime() / 1000;
                        result[date] = item.progress;
                    });
                    return result;
                }
            });

            setInterval(function() {
                cal.update(baseUrl + "/api/database");
            }, 30000);
        });
    </script>
</body>
</html>
